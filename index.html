<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAB Welfare — Association Welfare & Loan Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#1d2b28;--mute:#61716d;--line:#dfe6e3;--pri:#0f6b5c;--pri2:#e3f1ee;--warn:#b26a00;--warn2:#fff4e0;--bad:#b3261e;--bad2:#fdecea;--ok:#1e7d32;--ok2:#e7f5e9;--r:10px}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
#app{display:flex;min-height:100vh}
#side{width:230px;background:#0c3f37;color:#dceee9;padding:16px 12px;flex-shrink:0;display:flex;flex-direction:column;gap:14px}
#side .brand{font-weight:700;font-size:17px;color:#fff;letter-spacing:.3px}
#side .brand small{display:block;font-weight:400;font-size:11px;color:#9fc9bf}
#side select{width:100%;padding:7px;border-radius:7px;border:0;font:inherit}
#side nav a{display:block;padding:8px 10px;border-radius:7px;color:#dceee9;text-decoration:none;margin-bottom:2px}
#side nav a:hover{background:#13544a}#side nav a.on{background:#1b6d60;color:#fff;font-weight:600}
#side .lbl{font-size:11px;text-transform:uppercase;color:#8fbab0;margin-bottom:4px;letter-spacing:.5px}
#side .btn{background:#1b6d60;color:#fff;width:100%}
main{flex:1;min-width:0;padding:20px 26px 60px}
#top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
#top h1{font-size:20px;margin:0;flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .k{font-size:12px;color:var(--mute)}.kpi .v{font-size:20px;font-weight:700;margin-top:2px}.kpi .s{font-size:11px;color:var(--mute)}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--mute);font-weight:600;background:#fafcfb}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover td{background:#f6faf9}
.tw{overflow-x:auto}
.btn{display:inline-block;border:1px solid transparent;background:var(--pri);color:#fff;padding:7px 12px;border-radius:7px;font:inherit;cursor:pointer;text-decoration:none}
.btn.sec{background:#fff;color:var(--pri);border-color:var(--pri)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.bad{background:var(--bad)}.btn.ghost{background:transparent;color:var(--mute);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok2);color:var(--ok)}.b-warn{background:var(--warn2);color:var(--warn)}.b-bad{background:var(--bad2);color:var(--bad)}.b-mute{background:#eef1f0;color:var(--mute)}.b-pri{background:var(--pri2);color:var(--pri)}
.note{background:var(--warn2);border-left:3px solid var(--warn);padding:8px 12px;border-radius:6px;font-size:13px;margin-bottom:12px}
.info{background:var(--pri2);border-left:3px solid var(--pri);padding:8px 12px;border-radius:6px;font-size:13px;margin-bottom:12px}
.err{background:var(--bad2);border-left:3px solid var(--bad);padding:8px 12px;border-radius:6px;font-size:13px;margin:8px 0}
.okbox{background:var(--ok2);border-left:3px solid var(--ok);padding:8px 12px;border-radius:6px;font-size:13px;margin:8px 0}
.muted{color:var(--mute)}.small{font-size:12px}
label.f{display:block;margin-bottom:10px;font-size:12px;color:var(--mute)}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:3px;padding:7px 8px;border:1px solid var(--line);border-radius:7px;font:inherit;color:var(--ink);background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}
input.cell{width:100%;min-width:60px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;font:inherit}
input.cell.num{text-align:right;max-width:110px}
#modal{position:fixed;inset:0;background:rgba(10,30,26,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;overflow:auto;z-index:20}
#modal.hidden{display:none}
#modal .box{background:#fff;border-radius:12px;width:100%;max-width:620px;padding:18px 20px}
#modal h3{margin:0 0 12px;font-size:17px}
.gl{max-height:170px;overflow:auto;border:1px solid var(--line);border-radius:7px;padding:6px 8px;color:var(--ink)}
.gl label{display:block;font-size:13px;padding:2px 0}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#173f38;color:#fff;padding:9px 16px;border-radius:8px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30}
#toast.show{opacity:1}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:20px;cursor:pointer;font:inherit}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
textarea.code{width:100%;height:180px;font:12px monospace;border:1px solid var(--line);border-radius:7px;padding:8px}
@media(max-width:820px){#app{flex-direction:column}#side{width:auto}#side nav{display:flex;flex-wrap:wrap;gap:4px}#side nav a{margin:0}main{padding:14px}.grid2,.grid3{grid-template-columns:1fr}}

.hidden{display:none!important}
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#0c3f37,#13544a)}
#auth .box{background:#fff;border-radius:14px;padding:26px 26px 20px;width:100%;max-width:400px}
#auth h1{font-size:20px;margin:0 0 2px}#auth .sub{color:var(--mute);font-size:13px;margin-bottom:18px}
#auth .links{display:flex;justify-content:space-between;margin-top:12px;font-size:13px}
#auth a{color:var(--pri);cursor:pointer}
#loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--mute)}
#side .me{font-size:12px;color:#bfe0d8;border-top:1px solid #1d5a50;padding-top:10px}
#side .me b{color:#fff;display:block;word-break:break-all}
body.ro main .btn:not(.ro-ok){display:none}
.busy{opacity:.6;pointer-events:none}
</style>

<div id="auth" class="hidden"><div class="box">
  <h1>KAB Welfare</h1><div class="sub" id="authSub">Association Welfare &amp; Loan Manager</div>

</form></div></div>

<script>
/* ================= CONFIG ================= */
const SUPABASE_URL='https://gqggyeultrdwrrwyhzup.supabase.co';
const SUPABASE_KEY='sb_publishable_5JcjMXVr7jQUJ_nRKh3_Bw_L_gfARD_';

/* ================= helpers ================= */
let sb;
let ME={user:null,email:'',admin:false,roles:[],assocs:[]};
let DB={current:null,tenants:{}};
let VIEW={role:'exec',readonly:false,memberId:null,myMemberId:null,reportTab:'statement',reportMember:null,fy:null,payFilter:'',memberSearch:'',dir:[]};
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const r2=n=>Math.round(n*100)/100;
const iso=d=>{const z=new Date(d);return z.getFullYear()+'-'+String(z.getMonth()+1).padStart(2,'0')+'-'+String(z.getDate()).padStart(2,'0')};
const pd=s=>{if(!s)return null;const[a,b,c]=String(s).slice(0,10).split('-').map(Number);return new Date(a,b-1,c||1)};
const mi=d=>d.getFullYear()*12+d.getMonth();
const addM=(s,n)=>{const d=pd(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return d};
const fd=s=>s?pd(s).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—';
const sum=(a,f)=>a.reduce((t,x)=>t+num(f?f(x):x),0);
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const T=()=>DB.tenants[DB.current];
const S=()=>T().settings;
const money=n=>(S().currency||'GHS')+' '+num(n).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),3200)}
const ROLE_LABEL={president:'President',vice_president:'Vice-President',secretary:'Secretary',treasurer:'Treasurer',financial_secretary:'Financial Secretary',dcrc:'DCRC',auditor:'Auditor',member:'Member',kab_admin:'KAB Tech admin'};
const EXEC_ROLES=['president','vice_president','secretary','treasurer','financial_secretary','kab_admin'];
const NOCASH=['Benefit offset','Opening balance'];          // not real money movement
const NOINCOME=['Benefit offset','Opening balance','Opening cash']; // not income for the year
function friendly(e){const m=(e&&(e.message||e.error_description||e.msg))||String(e);
 if(/row-level security|permission denied|42501/i.test(m))return "Your role in this association doesn't allow that action.";
 if(/duplicate key|23505/i.test(m))return 'That record already exists.';
 if(/foreign key|23503/i.test(m))return 'This record is linked to other records, so it cannot be removed.';
 if(/Failed to fetch|NetworkError|Load failed/i.test(m))return "Can't reach the server. Check your internet connection and try again.";
 if(/Invalid login credentials/i.test(m))return 'Wrong email or password.';
 if(/Email not confirmed/i.test(m))return 'Please open the confirmation link we emailed you first, then sign in.';
 if(/rate limit/i.test(m))return 'Too many emails sent in a short time. Please wait a while and try again.';
 if(/Password should be/i.test(m))return 'Password must be at least 6 characters.';
 return m}
async function q(p){const{data,error}=await p;if(error)throw error;return data}
async function ins(t,row){const{data,error}=await sb.from(t).insert(row).select();if(error)throw error;if(!data||!data.length)throw new Error('permission denied');return Array.isArray(row)?data:data[0]}
async function upd(t,id,patch,key){const{data,error}=await sb.from(t).update(patch).eq(key||'id',id).select();if(error)throw error;if(!data||!data.length)throw new Error('permission denied');return data[0]}
async function delw(t,filters){let x=sb.from(t).delete();for(const[k,v]of Object.entries(filters))x=x.eq(k,v);const{data,error}=await x.select();if(error)throw error;if(!data||!data.length)throw new Error('permission denied')}
function myRole(){const rs=ME.roles.filter(r=>r.association_id===DB.current).map(r=>r.role);if(ME.admin&&!rs.length)rs.push('kab_admin');return rs}
function roleText(){return myRole().map(r=>ROLE_LABEL[r]||r).join(', ')||'—'}
async function log(a){try{await sb.from('activity_log').insert({association_id:DB.current,user_id:ME.user.id,actor:ME.email+' ('+roleText()+')',action:a})}catch(e){}}
async function reload(){DB.tenants[DB.current]=await loadTenant(DB.current)}
async function act(fn,okMsg){document.body.classList.add('busy');try{await fn();await reload();render();if(okMsg)toast(okMsg)}catch(e){console.error(e);toast(friendly(e))}finally{document.body.classList.remove('busy')}}

/* ================= load from Supabase ================= */
async function loadTenant(aid){
 const by=t=>sb.from(t).select('*').eq('association_id',aid);
 const [as,lps,cats,rates,bts,ms,pays,cls,lns,exs,logs]=await Promise.all([
  q(sb.from('associations').select('*').eq('id',aid)),q(by('loan_policies')),q(by('member_categories')),q(by('dues_rates')),
  q(by('benefit_types')),q(by('members')),q(by('payments')),q(by('claims')),q(by('loans')),q(by('expenses')),
  q(sb.from('activity_log').select('*').eq('association_id',aid).order('at',{ascending:false}).limit(400))]);
 if(!as.length)throw new Error('This association could not be found, or you no longer have access to it.');
 const btIds=bts.map(b=>b.id),lnIds=lns.map(l=>l.id);
 const [amts,gs]=await Promise.all([btIds.length?q(sb.from('benefit_amounts').select('*').in('benefit_type_id',btIds)):[],lnIds.length?q(sb.from('loan_guarantors').select('*').in('loan_id',lnIds)):[]]);
 const A=as[0],L=lps[0]||{};
 const settings={name:A.name,shortCode:A.short_code||'',address:A.address||'',currency:A.currency||'GHS',fyStartMonth:A.fy_start_month,dueDay:A.due_day,regFee:num(A.reg_fee),penaltyPct:num(A.penalty_pct),arrearsFlagMonths:A.arrears_flag_months,waitingMonths:A.waiting_months,noticeDays:A.notice_days,benefitsActive:!!A.benefits_active,loansActive:!!A.loans_active,
  loan:{poolPct:num(L.pool_pct??40),minMonths:num(L.min_months??6),multiple:num(L.multiple_of_dues??2),cap:num(L.flat_cap),emergencyFeePct:num(L.emergency_fee_pct),generalFeePct:num(L.general_fee_pct),maxMonths:num(L.max_months??6),guarantorThreshold:num(L.guarantor_threshold),guarantorsRequired:num(L.guarantors_required??2),defaultDays:num(L.default_days??60),maxGuarantees:num(L.max_guarantees??2),offsetFromBenefits:L.offset_from_benefits!==false}};
 const categories=cats.map(c=>{const rs=rates.filter(r=>r.category_id===c.id).map(r=>({from:String(r.effective_from).slice(0,10),amt:num(r.monthly_amount)})).sort((x,y)=>x.from.localeCompare(y.from));
  const cur=[...rs].reverse().find(r=>pd(r.from)<=TODAY)||rs[rs.length-1];return{id:c.id,name:c.name,rates:rs,dues:cur?cur.amt:0}}).sort((a,b)=>a.name.localeCompare(b.name));
 const t={id:aid,settings,categories,
  benefitTypes:bts.map(b=>({id:b.id,name:b.name,maxTimes:num(b.max_times),note:b.note||'',active:!!b.active,amounts:Object.fromEntries(amts.filter(x=>x.benefit_type_id===b.id).map(x=>[x.category_id,num(x.amount)]))})).sort((a,b)=>a.name.localeCompare(b.name)),
  members:ms.map(m=>({id:m.id,memberNo:m.member_no,name:m.full_name,phone:m.phone||'',email:m.email||'',categoryId:m.category_id,joinDate:String(m.join_date).slice(0,10),status:m.status,exitDate:m.exit_date?String(m.exit_date).slice(0,10):'',nok:m.next_of_kin||'',nokPhone:m.next_of_kin_phone||'',notes:m.notes||'',userId:m.user_id})),
  payments:pays.map(p=>({id:p.id,date:String(p.paid_on).slice(0,10),memberId:p.member_id||'',type:p.type,loanId:p.loan_id,amount:num(p.amount),channel:p.channel,ref:p.reference||'',note:p.note||'',period:p.period_month?String(p.period_month).slice(0,7):''})),
  claims:cls.map(c=>({id:c.id,memberId:c.member_id,typeId:c.benefit_type_id,eventDate:String(c.event_date).slice(0,10),desc:c.details||'',amount:num(c.amount),status:c.status,created:c.created_on,approvedOn:c.approved_on,paidOn:c.paid_on?String(c.paid_on).slice(0,10):'',channel:c.channel||'',ref:c.reference||'',offset:num(c.loan_offset),override:c.override_reason||'',reject:c.reject_reason||''})),
  loans:lns.map(l=>({id:l.id,memberId:l.member_id,kind:l.kind,principal:num(l.principal),feePct:num(l.fee_pct),fee:num(l.fee),total:num(l.total),months:num(l.months),guarantors:gs.filter(g=>g.loan_id===l.id).map(g=>g.member_id),consents:Object.fromEntries(gs.filter(g=>g.loan_id===l.id).map(g=>[g.member_id,g.consented])),purpose:l.purpose||'',applied:String(l.applied_on).slice(0,10),status:l.status,approvedOn:l.approved_on,disbursed:l.disbursed_on?String(l.disbursed_on).slice(0,10):'',channel:l.channel||'',ref:l.reference||'',override:l.override_reason||'',reject:l.reject_reason||''})),
  expenses:exs.map(e=>({id:e.id,date:String(e.spent_on).slice(0,10),desc:e.description,amount:num(e.amount),category:e.category||''})),
  audit:logs.map(x=>({t:x.at,who:x.actor||'',a:x.action}))};
 if(VIEW.role==='member'){try{VIEW.dir=(await q(sb.rpc('member_directory',{a:aid})))||[]}catch(e){VIEW.dir=[]}}
 return t}

/* ================= rules engine ================= */
const mem=id=>T().members.find(m=>m.id===id);
const nameOf=id=>mem(id)?.name||(VIEW.dir.find(d=>d.id===id)||{}).full_name||'(member)';
const cat=m=>T().categories.find(c=>c.id===m.categoryId)||{name:'?',dues:0,rates:[]};
const btype=id=>T().benefitTypes.find(b=>b.id===id)||{name:'(deleted type)',amounts:{},maxTimes:0};
function rateAt(c,m){for(let i=c.rates.length-1;i>=0;i--){if(mi(pd(c.rates[i].from))<=m)return c.rates[i].amt}return 0}
function lastDueMI(){return mi(TODAY)-(TODAY.getDate()>=num(S().dueDay||1)?0:1)}
function owedRange(m){const st=mi(pd(m.joinDate));let end=lastDueMI();if(m.status!=='active'&&m.exitDate)end=Math.min(end,mi(pd(m.exitDate)));return[st,end]}
function monthsMember(m){return Math.max(0,mi(TODAY)-mi(pd(m.joinDate)))}
function duesInfo(m){const c=cat(m),[st,end]=owedRange(m);let owed=0,months=0;for(let k=st;k<=end;k++){owed+=rateAt(c,k);months++}
 const rate=num(c.dues);const paid=r2(sum(T().payments.filter(p=>p.memberId===m.id&&p.type==='dues'),p=>p.amount));
 owed=r2(owed);const arrears=Math.max(0,r2(owed-paid)),credit=Math.max(0,r2(paid-owed));
 return{rate,months,owed,paid,arrears,credit,arrearsMonths:rate?arrears/rate:0,penalty:r2(arrears*num(S().penaltyPct)/100)}}
const goodStanding=m=>m.status==='active'&&duesInfo(m).arrears<=0.004;
function benefitsReceived(m){return T().claims.filter(c=>c.memberId===m.id&&c.status==='paid').length}
function cashBalance(){const t=T();
 const inc=sum(t.payments.filter(p=>!NOCASH.includes(p.channel)),p=>p.amount);
 const ben=sum(t.claims.filter(c=>c.status==='paid'&&!NOCASH.includes(c.channel)),c=>num(c.amount)-num(c.offset));
 const lo=sum(t.loans.filter(l=>l.status==='approved'&&!NOCASH.includes(l.channel)),l=>l.principal);
 return r2(inc-ben-lo-sum(t.expenses,e=>e.amount))}
function loanInfo(l){const t=T();const paid=r2(sum(t.payments.filter(p=>p.type==='loan'&&p.loanId===l.id),p=>p.amount));
 const out=Math.max(0,r2(l.total-paid));const inst=l.months?l.total/l.months:0;
 const res={paid,out,inst,overdue:0,days:0,state:l.status,schedule:[],princOut:0};
 if(l.status!=='approved'||!l.disbursed)return res;
 let cum=0,first=null;
 for(let i=1;i<=l.months;i++){const due=addM(l.disbursed,i);cum+=inst;res.schedule.push({n:i,due:iso(due),amt:inst,cum});if(due<=TODAY&&cum>paid+0.004&&!first)first=due}
 const dueSoFar=Math.min(l.total,inst*res.schedule.filter(s=>pd(s.due)<=TODAY).length);
 res.overdue=Math.max(0,r2(dueSoFar-paid));res.days=first?Math.floor((TODAY-first)/864e5):0;
 res.princOut=l.total?r2(out*l.principal/l.total):0;
 res.state=out<=0.004?'repaid':(res.days>num(S().loan.defaultDays)?'default':(res.overdue>0?'overdue':'active'));
 return res}
function openLoans(){return T().loans.filter(l=>l.status==='pending'||(l.status==='approved'&&loanInfo(l).state!=='repaid'))}
function poolInfo(){const lp=S().loan;const outP=r2(sum(T().loans.filter(l=>l.status==='approved'),l=>loanInfo(l).princOut));
 const cash=cashBalance();const fund=cash+outP;const cap=r2(fund*num(lp.poolPct)/100);
 return{cash,outP,fund,cap,avail:Math.max(0,r2(Math.min(cap-outP,cash)))}}

function inviteForm(){modal('Invite someone',`<label class="f">Their email address<input type="email" name="email" required placeholder="name@example.com"></label>

 <label class="f">Which member is this? <span class="small">(needed for "Member"; recommended for executives so they can see their own statement)</span><select name="member_id"><option value="">— not linked —</option>${memberOptions('',()=>true)}</select></label>`,async d=>{

const SETCOL={name:'name',shortCode:'short_code',address:'address',currency:'currency',fyStartMonth:'fy_start_month',dueDay:'due_day',regFee:'reg_fee',penaltyPct:'penalty_pct',arrearsFlagMonths:'arrears_flag_months',waitingMonths:'waiting_months',noticeDays:'notice_days',benefitsActive:'benefits_active',loansActive:'loans_active'};
const LOANCOL={poolPct:'pool_pct',minMonths:'min_months',multiple:'multiple_of_dues',cap:'flat_cap',emergencyFeePct:'emergency_fee_pct',generalFeePct:'general_fee_pct',maxMonths:'max_months',guarantorThreshold:'guarantor_threshold',guarantorsRequired:'guarantors_required',defaultDays:'default_days',maxGuarantees:'max_guarantees',offsetFromBenefits:'offset_from_benefits'};
function pgSettings(){const t=T(),s=S();header('Settings');const dis=VIEW.readonly?'disabled':'';
 const fld=(label,path,type,extra)=>{const v=path.split('.').reduce((o,k)=>o[k],s);return `<label class="f">${label}<input type="${type||'text'}" value="${esc(v)}" ${extra||''} ${dis} onchange="setS('${path}',this.value,'${type||'text'}')"></label>`};
 const tog=(label,path,help)=>{const v=path.split('.').reduce((o,k)=>o[k],s);return `<label style="display:flex;gap:8px;align-items:flex-start;margin-bottom:10px"><input type="checkbox" ${v?'checked':''} ${dis} onchange="setS('${path}',this.checked,'bool')"><span><b>${label}</b><br><span class="small muted">${help||''}</span></span></label>`};
 const firstOfMonth=iso(new Date(TODAY.getFullYear(),TODAY.getMonth(),1));
 let h=`<div class="info">These rules come from the association's constitution. When members amend it, change them here. Only the President can change association and loan rules; changes are recorded in the activity log.</div>`;
 h+=`<div class="card"><h2>Association</h2><div class="grid2">${fld('Name','name')}${fld('Short code (used in member numbers)','shortCode')}${fld('Address','address')}${fld('Currency','currency')}<label class="f">Financial year starts in<select ${dis} onchange="setS('fyStartMonth',this.value,'number')">${MONTHS.map((m,i)=>opt(i+1,m,s.fyStartMonth)).join('')}</select></label></div></div>`;
 h+=`<div class="card"><h2>Dues &amp; arrears</h2><div class="grid3">${fld('Registration fee','regFee','number','min=0 step=0.01')}${fld('Dues counted as owed from day (of month)','dueDay','number','min=1 max=31')}${fld('Arrears penalty before benefit (%)','penaltyPct','number','min=0')}${fld('Refer to DCRC after (months in arrears)','arrearsFlagMonths','number','min=1')}${fld('Benefit waiting period (months)','waitingMonths','number','min=0')}${fld('Event notice required (days)','noticeDays','number','min=0')}</div>
 <h2 style="margin-top:8px">Member categories &amp; monthly dues</h2><table><tr><th>Category</th><th class="n">Monthly dues now</th><th>Rate history</th><th>Members</th><th></th></tr>${t.categories.map(c=>`<tr><td><input class="cell" value="${esc(c.name)}" ${dis} onchange="setCat('${c.id}','name',this.value)"></td><td class="n"><input class="cell num" type="number" min="0" step="0.01" value="${c.dues}" ${dis} onchange="setCat('${c.id}','dues',this.value)"></td><td class="small muted">${c.rates.map(r=>`${money(r.amt)} from ${r.from<='2000-12-31'?'start':fd(r.from)}`).join(' → ')}</td><td>${t.members.filter(m=>m.categoryId===c.id).length}</td><td><button class="btn sm ghost" onclick="delCat('${c.id}')">Remove</button></td></tr>`).join('')}</table><button class="btn sm sec" style="margin-top:8px" onclick="addCat()">+ Add category</button>
 <p class="small muted">Changing a dues amount applies from ${fd(firstOfMonth)}. Earlier months keep the old rate, so past arrears don't change.</p></div>`;
 h+=`<div class="card"><h2>Welfare benefits</h2>${tog('Benefits are active','benefitsActive','Turn on when members agree benefits can start.')}
 <div class="tw"><table><tr><th>Benefit / event</th>${t.categories.map(c=>`<th class="n">${esc(c.name)}</th>`).join('')}<th class="n">Max times<br><span class="small">0 = no limit</span></th><th>Note</th><th>Active</th><th></th></tr>
 ${t.benefitTypes.map(b=>`<tr><td><input class="cell" value="${esc(b.name)}" ${dis} onchange="setBT('${b.id}','name',this.value)"></td>${t.categories.map(c=>`<td class="n"><input class="cell num" type="number" min="0" step="0.01" value="${num(b.amounts[c.id])}" ${dis} onchange="setBTAmt('${b.id}','${c.id}',this.value)"></td>`).join('')}<td class="n"><input class="cell num" style="max-width:70px" type="number" min="0" value="${num(b.maxTimes)}" ${dis} onchange="setBT('${b.id}','maxTimes',this.value)"></td><td><input class="cell" value="${esc(b.note)}" ${dis} onchange="setBT('${b.id}','note',this.value)"></td><td><input type="checkbox" ${b.active?'checked':''} ${dis} onchange="setBT('${b.id}','active',this.checked)"></td><td><button class="btn sm ghost" onclick="delBT('${b.id}')">Remove</button></td></tr>`).join('')}
 </table></div><button class="btn sm sec" style="margin-top:8px" onclick="addBT()">+ Add benefit</button></div>`;
 h+=`<div class="card"><h2>Loan scheme</h2>${tog('Loan scheme is active','loansActive','Switch on when the Executive Council judges the fund mature enough.')}
 <div class="grid3">${fld('Max share of fund lent out (%)','loan.poolPct','number','min=0 max=100')}${fld('Minimum months of membership','loan.minMonths','number','min=0')}${fld('Loan limit = dues paid ×','loan.multiple','number','min=0 step=0.1')}${fld('Flat maximum loan (0 = none)','loan.cap','number','min=0')}${fld('Emergency loan fee (%)','loan.emergencyFeePct','number','min=0 step=0.1')}${fld('General loan fee (%)','loan.generalFeePct','number','min=0 step=0.1')}${fld('Maximum repayment months','loan.maxMonths','number','min=1')}${fld('Guarantors needed above amount','loan.guarantorThreshold','number','min=0')}${fld('Number of guarantors needed','loan.guarantorsRequired','number','min=0')}${fld('Default after (days overdue)','loan.defaultDays','number','min=1')}${fld('Max loans one member may guarantee','loan.maxGuarantees','number','min=1')}</div>
 ${tog('Deduct unpaid loan balances from benefits','loan.offsetFromBenefits','When a borrower in default receives a benefit, the balance can be taken from it.')}
 <p class="small muted">Pool rule as built: loans outstanding may not exceed the set % of the whole welfare fund (cash + loans out), and never more than the cash on hand.</p></div>`;
 h+=`<div class="card"><h2>Data</h2><p class="small muted">Your data is stored online in the KAB Welfare database. Download a backup now and then and keep it safe.</p><div class="row"><button class="btn sec ro-ok" onclick="downloadBackup()">Download backup</button><button class="btn sec" onclick="openingForm()">Enter opening balances</button></div></div>`;
 return h}
function setS(path,val,type){const v=type==='number'?num(val):type==='bool'?!!val:val;
 act(async()=>{if(path.startsWith('loan.')){const k=path.slice(5);await upd('loan_policies',DB.current,{[LOANCOL[k]]:v},'association_id')}else await upd('associations',DB.current,{[SETCOL[path]]:v===''?null:v});
  await log(`Setting changed: ${path} = ${v}`);if(path==='name'){const a=ME.assocs.find(a=>a.id===DB.current);if(a)a.name=v}},'Saved')}
function setCat(id,k,v){act(async()=>{const c=T().categories.find(c=>c.id===id);
 if(k==='name'){await upd('member_categories',id,{name:v});await log(`Category renamed to ${v}`)}
 else{const from=iso(new Date(TODAY.getFullYear(),TODAY.getMonth(),1));const{error}=await sb.from('dues_rates').upsert({association_id:DB.current,category_id:id,monthly_amount:num(v),effective_from:from},{onConflict:'category_id,effective_from'});if(error)throw error;await log(`Dues for ${c.name} set to ${num(v)} from ${from}`)}},'Saved')}
function addCat(){act(async()=>{const c=await ins('member_categories',{association_id:DB.current,name:'New category'});await ins('dues_rates',{association_id:DB.current,category_id:c.id,monthly_amount:0,effective_from:'2000-01-01'});await log('Category added')},'Category added')}
function delCat(id){if(T().members.some(m=>m.categoryId===id)){toast('Move members out of this category first');return}if(T().categories.length<2){toast('At least one category is needed');return}act(async()=>{await delw('member_categories',{id});await log('Category removed')},'Removed')}
function setBT(id,k,v){const col={name:'name',maxTimes:'max_times',note:'note',active:'active'}[k];act(async()=>{await upd('benefit_types',id,{[col]:k==='maxTimes'?num(v):v});await log(`Benefit ${btype(id).name}: ${k} = ${v}`)},'Saved')}
function setBTAmt(id,cid,v){act(async()=>{const{error}=await sb.from('benefit_amounts').upsert({benefit_type_id:id,category_id:cid,amount:num(v)},{onConflict:'benefit_type_id,category_id'});if(error)throw error;await log(`Benefit ${btype(id).name}: amount for ${T().categories.find(c=>c.id===cid)?.name} = ${num(v)}`)},'Saved')}
function addBT(){act(async()=>{await ins('benefit_types',{association_id:DB.current,name:'New benefit',max_times:0,active:true});await log('Benefit type added')},'Benefit added')}
function delBT(id){if(T().claims.some(c=>c.typeId===id)){toast('Claims use this benefit — untick Active instead');return}act(async()=>{await delw('benefit_types',{id});await log('Benefit type removed')},'Removed')}
function downloadBackup(){const t=T();const data={exported:new Date().toISOString(),by:ME.email,association:t.settings,categories:t.categories,benefitTypes:t.benefitTypes,members:t.members,payments:t.payments,claims:t.claims,loans:t.loans,expenses:t.expenses};
 const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${(t.settings.shortCode||'association').replace(/\W+/g,'')}-backup-${iso(TODAY)}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('Backup downloaded')}
function pgActivity(){header('Activity log');const a=T().audit;return `<div class="card"><p class="small muted">Every change is recorded with who made it — useful for the auditor and the DCRC. Entries cannot be edited or deleted.</p><table><tr><th>When</th><th>Who</th><th>What</th></tr>${a.map(x=>`<tr><td class="small">${new Date(x.t).toLocaleString('en-GB')}</td><td class="small">${esc(x.who)}</td><td>${esc(x.a)}</td></tr>`).join('')}</table></div>`}

/* ================= forms ================= */
function memberForm(id){const t=T(),m=id?mem(id):null;const pre=(S().shortCode||'MEM').replace(/A$/,'');const nextNo=pre+'-'+String(t.members.length+1).padStart(3,'0');
 modal(m?'Edit member':'Add member',`<div class="grid2"><label class="f">Full name<input name="name" required value="${esc(m?.name)}"></label><label class="f">Member number<input name="memberNo" required value="${esc(m?.memberNo||nextNo)}"></label>
 <label class="f">Phone<input name="phone" value="${esc(m?.phone)}"></label><label class="f">Email<input name="email" type="email" value="${esc(m?.email)}"></label>
 <label class="f">Category<select name="categoryId">${t.categories.map(c=>opt(c.id,c.name+' — '+money(c.dues)+'/month',m?.categoryId)).join('')}</select></label><label class="f">Date joined (dues start)<input name="joinDate" type="date" required value="${m?.joinDate||iso(TODAY)}"></label>
 <label class="f">Next of kin<input name="nok" value="${esc(m?.nok)}"></label><label class="f">Next of kin phone<input name="nokPhone" value="${esc(m?.nokPhone)}"></label>
 ${m?`<label class="f">Status<select name="status">${['active','resigned','retired','deceased','exited'].map(s=>opt(s,s[0].toUpperCase()+s.slice(1),m.status)).join('')}</select></label><label class="f">Exit date (if not active)<input name="exitDate" type="date" value="${m.exitDate||''}"></label>`:''}</div>
 <label class="f">Notes<textarea name="notes" rows="2">${esc(m?.notes)}</textarea></label>${!m&&num(S().regFee)>0?`<label class="small" style="display:block"><input type="checkbox" name="reg"> Record registration fee of ${money(S().regFee)} paid today</label>`:''}
 ${!m||!m.userId?`<label class="small" style="display:block;margin-top:4px"><input type="checkbox" name="login"> Let this member sign in to see their own statement (uses the email above)</label>`:''}`,async d=>{
  if(t.members.some(x=>x.memberNo===d.memberNo.trim()&&x.id!==id))return 'That member number is already used.';
  if(d.status&&d.status!=='active'&&!d.exitDate)return 'Enter the exit date.';
  if(d.login&&!d.email)return 'Enter an email address to give this member a login.';
  const rec={full_name:d.name.trim(),member_no:d.memberNo.trim(),phone:d.phone||null,email:d.email||null,category_id:d.categoryId,join_date:d.joinDate,next_of_kin:d.nok||null,next_of_kin_phone:d.nokPhone||null,notes:d.notes||null};
  let mid=id;
  if(m){await upd('members',id,{...rec,status:d.status,exit_date:d.status==='active'?null:d.exitDate});await log(`Member updated: ${rec.full_name}`)}
  else{const nm=await ins('members',{association_id:DB.current,status:'active',...rec});mid=nm.id;
   if(d.reg)await ins('payments',{association_id:DB.current,member_id:nm.id,type:'registration',amount:num(S().regFee),paid_on:iso(TODAY),channel:'Cash',note:'Registration fee',recorded_by:ME.user.id});
   await log(`Member added: ${rec.full_name}`)}
  if(d.login){const{error}=await sb.from('invites').insert({association_id:DB.current,email:d.email.trim().toLowerCase(),role:'member',member_id:mid});if(error&&!/duplicate/i.test(error.message))throw error;await log(`Login invitation for member ${rec.full_name}`)}
  toast('Member saved')})}

function payForm(memberId,type,loanId){const t=T();
 modal('Record payment',`<div class="grid2"><label class="f">Member<select name="memberId" id="pMem"><option value="">— None (donation / other) —</option>${memberOptions(memberId,()=>true)}</select></label>
 <label class="f">Payment type<select name="type" id="pType">${Object.entries(PTYPES).map(([k,v])=>opt(k,v,type||'dues')).join('')}</select></label></div>
 <div id="pLoanWrap"></div>
 <div class="grid2"><label class="f">Amount<input name="amount" id="pAmt" type="number" min="0.01" step="0.01" required></label><label class="f">Date<input name="date" type="date" required value="${iso(TODAY)}"></label>
 <label class="f">Channel<select name="channel">${CHANNELS.map(c=>opt(c,c,'MoMo')).join('')}</select></label><label class="f">Reference (MoMo ID / bank ref)<input name="ref"></label></div>
 <label class="f">Note<input name="note" placeholder="e.g. Dues for Nov 2026"></label><div id="pHint" class="small muted"></div>`,async d=>{
  if(['dues','registration','penalty','loan'].includes(d.type)&&!d.memberId)return 'Choose the member for this payment.';
  if(d.type==='loan'&&!d.loanId)return 'This member has no active loan to repay.';
  const amount=r2(num(d.amount));if(amount<=0)return 'Enter an amount.';
  await ins('payments',{association_id:DB.current,member_id:d.memberId||null,type:d.type,loan_id:d.type==='loan'?d.loanId:null,amount,paid_on:d.date,channel:d.channel,reference:d.ref||null,note:d.note||null,recorded_by:ME.user.id});
  await log(`Payment recorded: ${PTYPES[d.type]} ${money(amount)}${d.memberId?' from '+nameOf(d.memberId):''} (${d.channel} ${d.ref||''})`);toast('Payment saved')});
 const updF=()=>{const m=mem($('#pMem').value),ty=$('#pType').value;let amt='',hint='';
  $('#pLoanWrap').innerHTML='';
  if(m){const d=duesInfo(m);
   if(ty==='dues'){amt=d.rate;hint=d.arrears>0?`Arrears: ${money(d.arrears)} (${d.arrearsMonths.toFixed(0)} months). Enter a larger amount to cover several months.`:'Member is up to date.'}
   if(ty==='registration')amt=S().regFee;
   if(ty==='penalty'){amt=d.penalty;hint=`${S().penaltyPct}% of current arrears ${money(d.arrears)}.`}
   if(ty==='loan'){const ls=t.loans.filter(l=>l.memberId===m.id&&l.status==='approved'&&loanInfo(l).state!=='repaid');
    $('#pLoanWrap').innerHTML=ls.length?`<label class="f">Loan<select name="loanId">${ls.map(l=>opt(l.id,`${fd(l.disbursed)} — balance ${money(loanInfo(l).out)}`,loanId)).join('')}</select></label>`:'<div class="err">No active loan for this member.</div>';
    if(ls.length){const l=ls.find(x=>x.id===loanId)||ls[0];const i=loanInfo(l);amt=r2(Math.min(i.inst,i.out));hint=`Monthly instalment ${money(i.inst)} · balance ${money(i.out)}${i.overdue?' · overdue '+money(i.overdue):''}`}}}
  $('#pAmt').value=amt;$('#pHint').textContent=hint};
 $('#pMem').onchange=updF;$('#pType').onchange=updF;updF();}

function bulkDuesForm(){const t=T();const act=t.members.filter(m=>m.status==='active').sort((a,b)=>a.name.localeCompare(b.name));
 const ym=iso(TODAY).slice(0,7);
 if(!act.length){toast('Add members first');return}
 modal('Record monthly dues (standing orders / payroll)',`<div class="grid2"><label class="f">Month<input type="month" name="month" id="bMonth" value="${ym}" required></label><label class="f">Channel<select name="channel">${CHANNELS.map(c=>opt(c,c,'Standing order')).join('')}</select></label>
 <label class="f">Date received<input type="date" name="date" value="${iso(TODAY)}" required></label><label class="f">Bank statement reference<input name="ref"></label></div>
 <div class="small muted" style="margin-bottom:4px">Tick members whose dues came in. Amounts can be changed.</div>
 <div class="gl" id="bList" style="max-height:300px"></div>`,async d=>{
  const [y,mo]=d.month.split('-');const label=MONTHS[+mo-1].slice(0,3)+' '+y;
  const rows=act.filter(m=>d['c_'+m.id]&&num(d['a_'+m.id])>0).map(m=>({association_id:DB.current,member_id:m.id,type:'dues',amount:r2(num(d['a_'+m.id])),paid_on:d.date,channel:d.channel,reference:d.ref||null,period_month:d.month+'-01',note:'Dues '+label,recorded_by:ME.user.id}));
  if(!rows.length)return 'No members ticked.';
  await ins('payments',rows);await log(`Monthly dues recorded for ${label}: ${rows.length} members, ${money(sum(rows,r=>r.amount))}`);toast(`${rows.length} payments recorded`)},'Record');
 const draw=()=>{const ymv=$('#bMonth').value;$('#bList').innerHTML=act.map(m=>{const done=t.payments.some(p=>p.memberId===m.id&&p.type==='dues'&&p.period===ymv);return `<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="c_${m.id}" ${done?'':'checked'}><span style="flex:1">${esc(m.name)}${done?' <span class="badge b-ok">already recorded</span>':''}</span><input class="cell num" name="a_${m.id}" type="number" step="0.01" value="${cat(m).dues}"></label>`}).join('')};
 $('#bMonth').onchange=draw;draw();}

function openingForm(){const t=T();const act=t.members.slice().sort((a,b)=>a.name.localeCompare(b.name));
 const has=t.payments.some(p=>p.channel==='Opening balance'||p.channel==='Opening cash');
 modal('Enter opening balances',`${has?'<div class="note">Opening balances have already been entered. Anything you enter now is added on top.</div>':''}
 <p class="small muted">Use this once, when the association starts using the system, so balances match its books.</p>
 <div class="grid2"><label class="f">Money in bank + MoMo today<input type="number" name="cash" step="0.01" min="0" value="0"></label><label class="f">As at date<input type="date" name="date" value="${iso(TODAY)}"></label></div>
 <div class="small muted" style="margin-bottom:4px">Total dues each member paid <b>before</b> today (so arrears are right):</div>
 <div class="gl" style="max-height:280px">${act.length?act.map(m=>`<label style="display:flex;gap:8px;align-items:center"><span style="flex:1">${esc(m.name)} <span class="small muted">owes ${money(duesInfo(m).owed)} since ${fd(m.joinDate)}</span></span><input class="cell num" name="o_${m.id}" type="number" step="0.01" min="0" value="0"></label>`).join(''):'<span class="muted">Add members first.</span>'}</div>
 <p class="small muted">Past benefits already paid can be recorded as claims and paid with channel "Opening balance", so one-time limits are respected without changing the cash balance.</p>`,async d=>{
  const rows=act.filter(m=>num(d['o_'+m.id])>0).map(m=>({association_id:DB.current,member_id:m.id,type:'dues',amount:r2(num(d['o_'+m.id])),paid_on:d.date,channel:'Opening balance',note:'Dues paid before using the system',recorded_by:ME.user.id}));
  if(num(d.cash)>0)rows.push({association_id:DB.current,member_id:null,type:'other',amount:r2(num(d.cash)),paid_on:d.date,channel:'Opening cash',note:'Opening bank + MoMo balance',recorded_by:ME.user.id});
  if(!rows.length)return 'Nothing entered.';
  await ins('payments',rows);await log(`Opening balances entered: cash ${money(d.cash)}, dues for ${rows.length-(num(d.cash)>0?1:0)} members`);toast('Opening balances saved')},'Save')}

function claimForm(memberId){const t=T(),isExec=VIEW.role==='exec';
 modal(isExec?'New benefit claim':'Request a welfare benefit',`<label class="f">Member<select name="memberId" id="cMem" ${isExec?'':'disabled'}>${memberOptions(memberId)}</select></label>${isExec?'':`<input type="hidden" name="memberId" value="${memberId}">`}
 <label class="f">Benefit<select name="typeId" id="cType">${t.benefitTypes.filter(b=>b.active).map(b=>opt(b.id,b.name)).join('')}</select></label>
 <div class="grid2"><label class="f">Date of event<input type="date" name="eventDate" id="cDate" required value="${iso(TODAY)}"></label><label class="f">Details<input name="desc" placeholder="e.g. Death of mother, burial on 12 Dec"></label></div>
 <div id="cPrev"></div>${isExec?`<label class="small"><input type="checkbox" name="ovr" id="cOvr"> Executive Council override (record the reason)</label><input class="cell" name="ovrWhy" id="cOvrWhy" placeholder="Reason / meeting decision" style="margin-top:4px;display:none">`:''}`,async d=>{
  const mid=d.memberId||memberId;const m=mem(mid);const ck=benefitCheck(m,d.typeId);
  if(!ck.ok&&!(isExec&&d.ovr))return 'This claim does not meet the rules: <ul>'+ck.issues.map(i=>'<li>'+esc(i)+'</li>').join('')+'</ul>'+(isExec?'Tick override only if the Executive Council has agreed.':'');
  if(isExec&&d.ovr&&!(d.ovrWhy||'').trim())return 'Give the reason for the override.';
  await ins('claims',{association_id:DB.current,member_id:mid,benefit_type_id:d.typeId,event_date:d.eventDate,details:d.desc||null,amount:ck.amount,status:'pending',override_reason:d.ovr?d.ovrWhy:null});
  await log(`Benefit claim: ${m.name} — ${btype(d.typeId).name} ${money(ck.amount)}${d.ovr?' (override: '+d.ovrWhy+')':''}`);toast(isExec?'Claim recorded — approve it on the Benefits page':'Request sent to the Executive Council')},isExec?'Save claim':'Send request');

function show(id){['#loading','#auth','#app'].forEach(s=>$(s).classList.toggle('hidden',s!==id));if(id!=='#auth'){$('#authForm').innerHTML='';$('#authMsg').innerHTML=''}}
function authScreen(mode,msg){show('#auth');const f=$('#authForm');$('#authMsg').innerHTML=msg||'';
 const L=$('#authLinks');
 if(mode==='login'){$('#authSub').textContent='Sign in to your association';
  f.innerHTML=`<label class="f">Email<input type="email" name="email" required autocomplete="email"></label><label class="f">Password<input type="password" name="password" required autocomplete="current-password"></label><button class="btn" style="width:100%">Sign in</button>`;
  L.innerHTML=`<a onclick="authScreen('signup')">Create account</a><a onclick="authScreen('forgot')">Forgot password?</a>`;
  f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));busyAuth(true);const{data,error}=await sb.auth.signInWithPassword({email:d.email.trim(),password:d.password});busyAuth(false);if(error)return authMsg(friendly(error),'err');await afterLogin(data.user)}}
 if(mode==='signup'){$('#authSub').textContent='Create your account — use the email your association invited';
  f.innerHTML=`<label class="f">Full name<input name="name" required></label><label class="f">Email<input type="email" name="email" required autocomplete="email"></label><label class="f">Choose a password (at least 6 characters)<input type="password" name="password" required minlength="6" autocomplete="new-password"></label><button class="btn" style="width:100%">Create account</button>`;
  L.innerHTML=`<a onclick="authScreen('login')">I already have an account</a>`;
  f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));busyAuth(true);const{data,error}=await sb.auth.signUp({email:d.email.trim(),password:d.password,options:{data:{full_name:d.name},emailRedirectTo:location.origin+location.pathname}});busyAuth(false);
   if(error)return authMsg(friendly(error),'err');if(data.session)return afterLogin(data.user);authScreen('login',`<div class="okbox">Account created. We sent a confirmation link to <b>${esc(d.email)}</b>. Open it, then sign in here.</div>`)}}
 if(mode==='forgot'){$('#authSub').textContent='Reset your password';
  f.innerHTML=`<label class="f">Email<input type="email" name="email" required></label><button class="btn" style="width:100%">Send reset link</button>`;
  L.innerHTML=`<a onclick="authScreen('login')">Back to sign in</a>`;
  f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));busyAuth(true);const{error}=await sb.auth.resetPasswordForEmail(d.email.trim(),{redirectTo:location.origin+location.pathname});busyAuth(false);if(error)return authMsg(friendly(error),'err');authMsg('If that email has an account, a reset link is on its way.','okbox')}}

  f.innerHTML=`<label class="f">New password<input type="password" name="password" required minlength="6" autocomplete="new-password"></label><button class="btn" style="width:100%">Save password</button>`;L.innerHTML='';

async function refreshMe(){const[adm,roles,assocs]=await Promise.all([sb.rpc('is_platform_admin'),sb.from('association_users').select('*').eq('user_id',ME.user.id),sb.from('associations').select('id,name,short_code').order('name')]);
 if(roles.error)throw roles.error;if(assocs.error)throw assocs.error;ME.admin=!!adm.data;ME.roles=roles.data||[];ME.assocs=assocs.data||[]}
async function afterLogin(user){ME.user=user;ME.email=user.email;show('#loading');
 try{await sb.rpc('accept_invites');await refreshMe()}catch(e){console.error(e);return authScreen('login',`<div class="err">${esc(friendly(e))}</div>`)}
 if(!ME.assocs.length){show('#app');DB={current:null,tenants:{}};$('#nav').innerHTML='';$('#tenantWrap').style.display='none';$('#newTenantBtn').style.display=ME.admin?'':'none';$('#meEmail').textContent=ME.email;$('#meRole').textContent=ME.admin?'KAB Tech admin':'';
  $('#top').innerHTML='<h1>Welcome</h1>';$('#view').innerHTML=ME.admin?`<div class="card"><h2>No associations yet</h2><p>Create the first one to begin.</p><button class="btn" onclick="newTenantForm()">+ New association</button></div>`:`<div class="note">Your account (<b>${esc(ME.email)}</b>) is not linked to an association yet. Ask your association's President to invite this email address, then sign out and sign in again.</div>`;return}
 let last=null;try{last=localStorage.getItem('kabw_last')}catch(e){}
 await switchTenant(ME.assocs.some(a=>a.id===last)?last:ME.assocs[0].id)}
async function switchTenant(aid){DB.current=aid;try{localStorage.setItem('kabw_last',aid)}catch(e){}
 const rs=myRole();const mrow=ME.roles.find(r=>r.association_id===aid&&r.role==='member');
 VIEW.myMemberId=(ME.roles.find(r=>r.association_id===aid&&r.member_id)||{}).member_id||null;
 if(ME.admin||rs.some(r=>EXEC_ROLES.includes(r))){VIEW.role='exec';VIEW.readonly=false}
 else if(rs.some(r=>r==='dcrc'||r==='auditor')){VIEW.role='exec';VIEW.readonly=true}
 else if(mrow){VIEW.role='member';VIEW.readonly=false;VIEW.memberId=mrow.member_id}
 show('#loading');
 try{await reload()}catch(e){console.error(e);show('#app');$('#view').innerHTML=`<div class="err">${esc(friendly(e))}</div>`;return}
 VIEW.reportMember=null;show('#app');
 if(VIEW.role==='member')location.hash='mine';else if(!location.hash||location.hash==='#mine')location.hash='dashboard';
 render()}
async function boot(){
 if(window.MOCK_SB)sb=window.MOCK_SB;
 else if(window.supabase&&window.supabase.createClient)sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 else{show('#auth');$('#authForm').innerHTML='';authMsg("Couldn't load the app. Check your internet connection and refresh the page.",'err');return}
 const isRecovery=/type=recovery/.test(location.hash);
 sb.auth.onAuthStateChange((ev)=>{if(ev==='PASSWORD_RECOVERY')authScreen('reset');if(ev==='SIGNED_OUT')authScreen('login')});
 const{data:{session}}=await sb.auth.getSession();
 if(isRecovery&&session)return authScreen('reset');
